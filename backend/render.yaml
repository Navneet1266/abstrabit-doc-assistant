services:
  - type: web
    name: doc-assistant-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: MAX_TOOL_ROUNDS
        value: "3"
